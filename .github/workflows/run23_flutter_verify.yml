name: Run24 committed Pinball mechanics QA

on:
  push:
    branches:
      - 'feature/pinball-run23-physics-event-telemetry-20261123'
    paths:
      - '.github/workflows/run23_flutter_verify.yml'
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics:
    name: Analyze, test, build committed Run24
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed Run24 source checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feature/pinball-run23-physics-event-telemetry-20261123'
          sha256sum -c - <<'SHA256S'
          7ebd538de4a1dd71dcf0553e9a54a027dbea3785fd2f7ae469297ebb21ee1bb4  lib/main.dart
          3dfd95e7123957bd58629bfdfd487b2cef82ec0d7473d01e3ef30f633dcd1b79  lib/developer_console.dart
          38b87385be25b2187f8142c68cbcd1fedb7a3d5b34000c2151a26abda80dfef7  lib/game/developer_scenarios.dart
          6de51d8a373662431a6257a8f4d777aea15f7e6106ee3b50d29b526b054d8cf3  lib/game/pinball_game.dart
          4e65c310c7bc6792cfabd2981cd116319f78c7eda1ab5be7c2f5c73d0ffccd6c  lib/game/shooter_lane.dart
          df489abec5eb61bbe8f024aa1e89ae5aa0313879a9ddef39d90f2153eca1ee26  test/gameplay_mechanics_test.dart
          42fd0cda5efb633da2f5fcf7d79c625bcac2c3899da11e2fa12bfe0d5f61d14c  test/shooter_lane_test.dart
          1fc650f27e7b16d34f65614ad97ad998fa32329735467c04d13d3b927b1c45c7  test/shooter_exit_handoff_test.dart
          a35d1d5d4e73017f9c0c84b16919371a844d062128179860d27048065c44b936  test/trajectory_invariants_test.dart
          0af53e938d3e0d90f23cdba622e964f9b64dc6af65b6a1fd8f2494c0b58d24cb  test/developer_console_test.dart
          eca3a1426775baeed7791eca9593981c4935d20a605c9b4a20f6896b8d51e3ba  test/run23_ball_path_and_contact_test.dart
          SHA256S
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Dart and Flutter versions
        run: |
          dart --version
          flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format candidate source
        run: dart format lib/main.dart lib/developer_console.dart lib/game/developer_scenarios.dart lib/game/pinball_game.dart lib/game/shooter_lane.dart test/gameplay_mechanics_test.dart test/shooter_lane_test.dart test/shooter_exit_handoff_test.dart test/trajectory_invariants_test.dart test/developer_console_test.dart test/run23_ball_path_and_contact_test.dart
      - name: Static analysis (strict)
        id: strict_analysis
        continue-on-error: true
        run: flutter analyze
      - name: Static analysis (blocking errors)
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        id: unit_tests
        continue-on-error: true
        run: flutter test
      - name: Production web build
        run: flutter build web --release
      - name: Preserve isolated web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinball-run24-web-branch-preview
          path: build/web
          retention-days: 1
      - name: Source whitespace integrity
        run: git diff --check
      - name: Unit test gate
        if: always()
        run: test "${{ steps.unit_tests.outcome }}" = success
      - name: Strict analysis gate
        if: always()
        run: test "${{ steps.strict_analysis.outcome }}" = success
